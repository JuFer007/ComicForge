<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Forge - Descuentos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.cdnfonts.com/css/jember-sketch" rel="stylesheet">
    <!--CONEXION CON BOOTSTRAP-->
    <link rel="stylesheet" href="https://cdn.lineicons.com/5.0/lineicons.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!--CONEXION CON LOS ICONOS DE GOOGLE-->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <!-- ENLACE PARA LAS HOJAS DE ESTILO -->
    <link href="/css/styleDescuentos.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styleheader.css">
    <link rel="stylesheet" href="/css/styleDarkMode.css">
    <link rel="stylesheet" href="/css/styleFooter.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
<header th:replace="~{fragments/_layout :: header}"></header>

<main class="py-5">
    <div class="container">
        <h1 class="page-title">¡Descuentos Imperdibles!</h1>

        <!-- Contenedor para las tarjetas dinámicas -->
        <div class="row justify-content-center" id="descuentos-container">
            <!-- Aquí se insertan los cómics con JS -->
        </div>

        <!-- Paginación Dinámica (dentro del main) -->
        <nav aria-label="Navegación de páginas">
            <ul class="pagination mt-5" id="pagination-container"></ul>
        </nav>
    </div>
</main>

<!-- Botón Flotante Modo Oscuro -->
<button id="darkModeToggle" class="dark-mode-toggle">
    <i class="fa-solid fa-moon"></i>
</button>

<!-- Footer -->
<footer th:replace="~{fragments/_layout :: footer}"></footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
