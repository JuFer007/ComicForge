<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Forge - Personajes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.cdnfonts.com/css/jember-sketch" rel="stylesheet">
    <!--CONEXION CON BOOTSTRAP-->
    <link rel="stylesheet" href="https://cdn.lineicons.com/5.0/lineicons.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!--CONEXION CON LOS ICONOS DE GOOGLE-->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- ENLACE PARA LAS HOJAS DE ESTILO -->
    <link href="/css/stylePersonajes.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styleheader.css">
    <link rel="stylesheet" href="/css/styleDarkMode.css">
    <link rel="stylesheet" href="/css/styleFooter.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
<nav th:replace="~{fragments/_layout :: header}"></nav>

<!-- Galería de Personajes -->
<section class="container-fluid my-5">
    <div class="row justify-content-center">
        <!-- Iteramos sobre la lista completa de personajes -->
        <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6" th:each="personaje, iterStat : ${personajes}">
            <div class="card character-card">
                <img th:src="${personaje.image}" class="card-img-top" th:alt="${personaje.nickName}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${personaje.nickName}"></h5>
                    <!-- Tabs -->
                    <ul class="nav nav-tabs" th:id="'tab-' + ${iterStat.index}" role="tablist">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" th:attr="data-bs-target='#desc-' + ${iterStat.index}">Info</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" th:attr="data-bs-target='#poderes-' + ${iterStat.index}">Poderes</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" th:attr="data-bs-target='#equipos-' + ${iterStat.index}">Equipos</button></li>
                    </ul>
                    <!-- Contenido Tabs -->
                    <div class="tab-content mt-2">
                        <div class="tab-pane fade show active" th:id="'desc-' + ${iterStat.index}" th:text="${personaje.description}"></div>
                        <div class="tab-pane fade" th:id="'poderes-' + ${iterStat.index}" th:text="${personaje.power}"></div>
                        <div class="tab-pane fade" th:id="'equipos-' + ${iterStat.index}" th:text="${personaje.teams}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Botón Flotante Modo Oscuro -->
<button id="darkModeToggle" class="dark-mode-toggle">
    <i class="fa-solid fa-moon"></i>
</button>

<!-- Pie de Página -->
<footer th:replace="~{fragments/_layout :: footer}"></footer>

<!-- JAVASCRIPT DE BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous">
</script>
<!--ION-ICONS-->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<!-- Scripts -->
<script src="/js/scriptNavbar.js"></script>
<script src="/js/scriptInicioSesion.js"></script>
<script src="/js/scriptPrincipal.js"></script>
<script src="/js/scriptProfile.js"></script>
<script src="/js/scriptSecciones.js"></script>
<script src="/js/scriptDarkMode.js"></script>
<script src="/js/scriptCharacterTabs.js"></script>
</body>
</html>
