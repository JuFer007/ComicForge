<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Forge - Compra Exitosa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styleheader.css">
    <link rel="stylesheet" href="/css/styleFooter.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1d1c1c;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* MODAL PERSONALIZADO */
        .modal-content {
            background: linear-gradient(135deg, #2a2a2a 0%, #1d1c1c 100%);
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            background: linear-gradient(135deg, #db3545 0%, #b71c1c 100%);
            border: none;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .modal-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .modal-title {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .btn-close {
            filter: brightness(0) invert(1);
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }

        .btn-close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 40px;
            text-align: center;
            color: white;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #db3545 0%, #b71c1c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(219, 53, 69, 0.5);
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon i {
            font-size: 4rem;
            color: white;
            animation: checkmark 0.8s ease-out 0.3s both;
        }

        @keyframes checkmark {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .success-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2ecc71;
            margin-bottom: 15px;
            animation: slideDown 0.6s ease-out 0.4s both;
        }

        @keyframes slideDown {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .success-message {
            font-size: 1.1rem;
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 10px;
            animation: slideDown 0.6s ease-out 0.5s both;
        }

        .success-submessage {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out 0.6s both;
        }

        .purchase-details {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            animation: slideDown 0.6s ease-out 0.7s both;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #888;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-value {
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
        }

        .modal-footer {
            background: rgba(0, 0, 0, 0.2);
            border: none;
            padding: 25px 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-custom {
            padding: 15px 40px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* RESPONSIVE */
        @media (max-width: 576px) {
            .modal-body {
                padding: 30px 20px;
            }

            .success-icon {
                width: 100px;
                height: 100px;
            }

            .success-icon i {
                font-size: 3rem;
            }

            .success-title {
                font-size: 1.6rem;
            }

            .modal-footer {
                flex-direction: column;
                padding: 20px;
            }

            .btn-custom {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/_layout :: header}"></header>

<main>
    <!-- El modal se mostrará automáticamente -->
</main>

<!-- MODAL DE ÉXITO -->
<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="successModalLabel">
                    <i class="bi bi-party-popper"></i> ¡Compra Realizada con Éxito!
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <div class="success-icon">
                    <i class="bi bi-check-circle-fill"></i>
                </div>

                <h2 class="success-title text-danger">¡Felicitaciones!</h2>

                <p class="success-message">
                    Tu compra ha sido procesada exitosamente.
                </p>
                <p class="success-submessage">
                    Gracias por confiar en <strong style="color: #db3545;">Comic Forge</strong>.
                    Tus cómics ya están disponibles en tu biblioteca.
                </p>

                <p style="color: #888; font-size: 0.9rem; margin-top: 20px;">
                    <i class="bi bi-info-circle"></i>
                    Puedes acceder a tus cómics desde tu perfil en cualquier momento.
                </p>
            </div>

            <div class="modal-footer">
                <a th:href="@{/}"  class="btn btn-danger">
                    <i class="bi bi-arrow-right-circle"></i>
                    Seguir Comprando
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/_layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Mostrar modal automáticamente
        const modal = new bootstrap.Modal(document.getElementById('successModal'));
        modal.show();

        // Generar fecha actual
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-PE', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        document.getElementById('purchaseDate').textContent = dateStr;

        // Generar número de orden aleatorio
        const orderNum = 'CF-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        document.getElementById('orderNumber').textContent = orderNum;

        // Crear confetti
        createConfetti();

        // Reproducir sonido de éxito (opcional)
        playSuccessSound();
    });

    function createConfetti() {
        const colors = ['#2ecc71', '#db3545', '#3498db', '#f39c12', '#9b59b6'];
        const confettiCount = 50;

        for (let i = 0; i < confettiCount; i++) {
            setTimeout(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }, i * 30);
        }
    }

    function playSuccessSound() {
        // Aquí podrías agregar un sonido de éxito si lo deseas
        // const audio = new Audio('/sounds/success.mp3');
        // audio.play();
    }

    // Redirigir al cerrar el modal
    document.getElementById('successModal').addEventListener('hidden.bs.modal', function () {
        // Opcional: redirigir automáticamente después de cerrar
        // window.location.href = '/comics';
    });
</script>

</body>
</html>
