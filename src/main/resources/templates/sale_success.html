<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Forge - Compra Exitosa</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styleheader.css">
    <link rel="stylesheet" href="/css/styleFooter.css">
    <link rel="stylesheet" href="/css/styleSucces.css">
</head>
<body>

<header th:replace="~{fragments/_layout :: header}"></header>

<main>
    <!-- El modal se mostrará automáticamente -->
</main>

<!-- MODAL DE ÉXITO -->
<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="successModalLabel">
                    <i class="bi bi-party-popper"></i> ¡Compra Realizada con Éxito!
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <div class="success-icon">
                    <i class="bi bi-check-circle-fill"></i>
                </div>

                <h2 class="success-title text-danger">¡Felicitaciones!</h2>

                <p class="success-message">
                    Tu compra ha sido procesada exitosamente.
                </p>
                <p class="success-submessage">
                    Gracias por confiar en <strong style="color: #db3545;">Comic Forge</strong>.
                    Tus cómics ya están disponibles en tu biblioteca.
                </p>

                <p style="color: #888; font-size: 0.9rem; margin-top: 20px;">
                    <i class="bi bi-info-circle"></i>
                    Puedes acceder a tus cómics desde tu perfil en cualquier momento.
                </p>
            </div>

            <div class="modal-footer">
                <a th:href="@{/}"  class="btn btn-danger">
                    <i class="bi bi-arrow-right-circle"></i>
                    Seguir Comprando
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/_layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/scriptSucces.js"></script>
</body>
</html>
